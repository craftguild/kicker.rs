[package]
name = "kicker"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "Verify webhooks and kick local shell commands or HTTP endpoints"

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
craftguild-cli = { git = "https://github.com/craftguild/standards.rs", rev = "be63eefb44a850a01f4cc065c66fff2fe558ee18" }
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
nix = { version = "0.30", features = ["signal", "process", "user"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
craftguild-cli-build = { git = "https://github.com/craftguild/standards.rs", rev = "be63eefb44a850a01f4cc065c66fff2fe558ee18" }

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
